let [t,x]=Q[qi];let all=D.units[U];
if(t=='learn'){let mn=D.mn[x[0]];M(`<div class=card><p>${qi+1}/${Q.length} ❤️${hearts}</p><h2>${x[0]}</h2><p><i>${x[1]}</i> — ${x[2]}</p>${mn?'<p>🧠 '+mn+'</p>':''}<button onclick="say(Q[qi][1][1])">▶ Hear</button> ${lg(x[0])}<br><button class=p onclick="qi++;step()">Got it</button></div>`)}
if(t=='mc'){let o=[x,...all.filter(y=>y!=x).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);M(`<div class=card><p>❤️${hearts}</p><h3>“${x[2]}”</h3>${o.map(y=>`<button onclick="chk(${y==x})">${y[0]}</button>`).join('')}</div>`)}
if(t=='type'){M(`<div class=card><p>❤️${hearts}</p><h3>Type the Gaelic for “${x[2]}”</h3><input id=a autofocus><button class=p onclick="chk(norm(a.value)==norm(Q[qi][1][0]))">Check</button><p><small>Accents: <button onclick="a.value+='à'">à</button><button onclick="a.value+='è'">è</button><button onclick="a.value+='ì'">ì</button><button onclick="a.value+='ò'">ò</button><button onclick="a.value+='ù'">ù</button></small></p></div>`)}}
const norm=s=>s.toLowerCase().replace(/[?.!,’']/g,'').trim();
function chk(ok,ans){let x=Q[qi][1];if(ok){award(2);fb('<p class=ok>✔ Ceart! Correct!</p>','qi++;step()')}else{hearts--;Q.push(Q[qi]);if(hearts<=0)return fb('<p class=bad>Out of hearts. The answer was <b>'+x[0]+'</b>.</p>','lesson(U)','Try again');fb('<p class=bad>✘ Not quite. Answer: <b>'+x[0]+'</b> <i>'+x[1]+'</i></p>','qi++;step()')}}
function fb(msg,next,label){let d=document.createElement('div');d.className='card';d.id='fb';d.innerHTML=msg+'<button class=p id=nx onclick="'+next+'">'+(label||'Continue')+'</button>';document.querySelectorAll('#m button:not(#nx),#m input').forEach(b=>b.disabled=true);document.getElementById('m').appendChild(d);document.getElementById('nx').focus()}
// SM-2
function due(){return Object.values(S.cards).filter(c=>c.due<=today())}
let R;
function review(){let d=due();if(!d.length)return M('<div class=card>Nothing due. Come back tomorrow! 🌿</div>');R=d[0];M(`<div class=card><p>${d.length} due</p><h3>${R.x[2]}</h3><button onclick="show()">Show answer</button><div id=ans></div></div>`)}
function show(){ans.innerHTML=`<h2>${R.x[0]}</h2><i>${R.x[1]}</i> ${lg(R.x[0])}<br>`+[['Again',1],['Hard',3],['Good',4],['Easy',5]].map(([l,q])=>`<button onclick="grade(${q})">${l}</button>`).join('');say(R.x[1])}
function grade(q){let c=R;if(q<3){c.n=0;c.i=1}else{c.i=c.n==0?1:c.n==1?6:Math.round(c.i*c.e);c.n++}c.e=Math.max(1.3,c.e+0.1-(5-q)*(0.08+(5-q)*0.02));c.due=new Date(Date.now()+c.i*864e5).toISOString().slice(0,10);award(1);review()}
function pool(){let p=S.done.flatMap(k=>D.units[k]);return p.length?p:D.units.G1}
let CZ;function cloze(){let c=pool().filter(x=>x[0].split(' ').length>1);let x=c[Math.floor(Math.random()*c.length)];let w=x[0].split(' '),k=Math.floor(Math.random()*w.length);CZ=[w[k],x];w[k]='____';M('<div class=card><h3>'+w.join(' ')+'</h3><p>'+x[2]+'</p><input id=a autocapitalize=off><button class=p onclick="clz()">Check</button></div>')}
function clz(){let ok=norm(a.value)==norm(CZ[0]);if(ok)award(2);fb((ok?'<p class=ok>✔ ':'<p class=bad>✘ ')+CZ[1][0]+' <i>'+CZ[1][1]+'</i></p>','cloze()','Next')}
async function audio(){M('<div class=card><p>Pimsleur-style: English prompt → pause → say it → answer. Recalls repeat at growing intervals.</p><button class=p onclick=run()>Start</button><button onclick=speechSynthesis.cancel();stop=1>Stop</button><div id=cur></div></div>')}
let stop=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function sayP(t){return new Promise(r=>{let done=0,f=()=>{if(!done){done=1;r()}};try{let u=new SpeechSynthesisUtterance(t);u.rate=.85;u.onend=f;u.onerror=f;speechSynthesis.speak(u)}catch(e){}setTimeout(f,800+t.length*90)})}
async function run(){stop=0;let p=pool().slice(0,10),seq=[];p.forEach((x,i)=>{seq.push(i);[1,3,7].forEach(g=>{if(i-g>=0)seq.push(i-g)})});for(let i of seq){if(stop)return;let x=p[i];cur.innerHTML=`<h3>${x[2]}</h3>`;await sayP('How do you say '+x[2]+'?');await wait(4000);cur.innerHTML+=`<h2>${x[0]}</h2><i>${x[1]}</i>`;await sayP(x[1]);await wait(1500)}award(10)}
function read(){M(TEXTS.map((t,i)=>`<div class=card><p>${t[0].split(' ').map(w=>`<span class=w onclick="tip(this)">${w}</span>`).join(' ')}</p><p id=g${i}></p><details><summary>Full translation</summary>${t[1]}</details></div>`).join('')+'<p><small>Tap any word to translate it.</small></p>')}
function tip(el){let w=norm(el.textContent);el.title=GL[w]||'?';el.parentNode.nextElementSibling.innerHTML=`<b>${el.textContent}</b> = ${GL[w]||'(not in glossary)'} ${lg(w)}`;award(1)}
hud();path();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
